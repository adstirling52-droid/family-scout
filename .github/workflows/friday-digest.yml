name: Friday weekend digest
on:
  schedule:
    # 10:00 UTC is 10:00 London in winter and 11:00 in summer.
    # One slot only: the window stays open after 10:00, so a second cron would email twice.
    - cron: "0 10 * * 5"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Email the digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_FROM: FamilyWeekend@alanstirling.com
          PLANNER_TO: alan@alanstirling.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m planner --send
          else
            python -m planner --scheduled
          fi
