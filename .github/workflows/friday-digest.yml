name: Friday weekend digest

on:
  schedule:
    - cron: "0 9 * * 5"
    - cron: "0 10 * * 5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Email the digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PLANNER_TO: alan@alanstirling.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m planner --send
          else
            python -m planner --scheduled
          fi

